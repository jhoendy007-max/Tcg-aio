  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; color: #f2f5f8; }
    body { margin: 0 auto; padding: 20px; max-width: 920px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 26px; margin: 0; }
    h1 { display: flex; align-items: center; gap: 10px; } .zzz-logo { border-radius: 22%; } h1 small { color: #8d8f9a; font-size: 12px; font-weight: 500; }
    h1 span { background: linear-gradient(135deg,#8b5cf6,#22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 13px; letter-spacing: 0.12em; margin-right: 8px; }
    p, small { color: #93a0b5; }
    button, input { font: inherit; color: inherit; border-radius: 8px; border: 1px solid #343b49; background: #181c24; padding: 8px 12px; }
    button.danger { background: #b4232c; color: #fff; border-color: transparent; font-weight: 700; }
    dialog { background: #12151c; color: inherit; border: 1px solid #343b49; border-radius: 12px; max-width: 420px; }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    select { font: inherit; color: inherit; border-radius: 8px; border: 1px solid #343b49; background: #181c24; padding: 8px 12px; }
    button.primary { background: #8b5cf6; color: #1c1508; border-color: transparent; font-weight: 700; }
    button.tab { background: #171b22; border-radius: 999px; }
    button.tab.on { background: #8b5cf6; color: #1c1508; border-color: transparent; }
    button.tab.on .badge { background: #1c1508; color: #8b5cf6; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .card { border: 1px solid #2a3140; border-radius: 16px; padding: 14px; margin: 10px 0; background: #171b22; }
    .error { background: #3a1d1d; color: #ffd0d0; padding: 10px 12px; border-radius: 12px; }
    .key { word-break: break-all; font-family: ui-monospace, monospace; }
    label { display: flex; flex-direction: column; gap: 4px; min-width: 160px; font-size: 13px; color: #c8cdd4; }
    .pill { border-radius: 999px; padding: 2px 8px; background: #2a3140; font-size: 12px; }
    .pill.pending { background: #3d3420; color: #8b5cf6; }
    .pill.active { background: #163528; color: #b7f0d6; }
    .pill.suspended { background: #3a1d1d; color: #ffd0d0; }
    .badge { background: #2a3140; color: #8b5cf6; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; }
    .check { flex-direction: row; align-items: center; gap: 8px; min-width: 0; }
    .empty { color: #93a0b5; border: 1px dashed #2a3140; border-radius: 16px; text-align: center; padding: 28px 16px; }
    /* Glass Neon theme tokens */
    :root { --neon-1: #8b5cf6; --neon-2: #22d3ee; --grad: linear-gradient(90deg, #8b5cf6, #6366f1 45%, #22d3ee); --glass: rgba(255,255,255,.06); --edge: rgba(167,139,250,.22); }
    body { min-height: 100vh; }
    html { background: radial-gradient(40vw 40vw at 5% 100%, rgba(139,92,246,.35), transparent 60%), radial-gradient(35vw 35vw at 100% 100%, rgba(34,211,238,.2), transparent 60%), #070a1f; background-attachment: fixed; }
    .card, dialog { background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(16px); box-shadow: 0 8px 30px rgba(10,6,40,.45); }
    dialog { background: rgba(16,18,44,.9); }
    button, input, select { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); border-radius: 10px; }
    button.primary, button.tab.on { background: var(--grad); color: #fff; border-radius: 999px; box-shadow: 0 0 16px rgba(139,92,246,.35); }
    button.tab.on .badge { background: rgba(0,0,0,.25); color: #fff; }
    button.danger { background: linear-gradient(90deg,#f472b6,#fb7185); border-radius: 999px; }
    .pill.pending { background: rgba(139,92,246,.18); color: #c4b5fd; }
    [hidden] { display: none !important; }
    /* 0.2.35: readable native dropdown lists */

    <div class="row">
      <button id="change-password" type="button" hidden>Change password</button>
      <button id="sign-out" type="button" hidden>Sign out</button>
    </div>
  </header>
  <p>Pending accounts come first. A gift key can still be created on its own and redeemed in the customer's account.</p>
  <div id="error"></div>
  <section id="login">
    <form id="login-form" class="card row">
      <label>Email<input id="email" type="email" autocomplete="username" required /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>
  <section id="desk" hidden>
    <form id="password-form" class="card row" hidden>
      <label>Current password<input id="current-password" type="password" autocomplete="current-password" required /></label>
      <label>New password<input id="next-password" type="password" autocomplete="new-password" required minlength="8" /></label>
      <button class="primary" type="submit">Save password</button>
      <button id="cancel-password" type="button">Cancel</button>
    </form>
    <div class="row">
      <button class="tab on" id="tab-pending" type="button">Pending <span id="count-pending" class="badge" hidden>0</span></button>
      <button class="tab" id="tab-active" type="button">Active <span id="count-active" class="badge" hidden>0</span></button>
      <button class="tab" id="tab-suspended" type="button">Suspended <span id="count-suspended" class="badge" hidden>0</span></button>
      <button class="tab" id="tab-gifts" type="button">Gift keys <span id="count-gifts" class="badge" hidden>0</span></button>
      <input id="search" placeholder="Search email" />
    </div>
    <div id="users"></div>
    <div id="gifts" hidden>
      <div class="row">
        <button class="primary" id="create" type="button">Create gift key</button>
      </div>
      <form id="create-form" class="card" hidden>
        <div class="row">
          <label>Note<input id="note" placeholder="Gift" /></label>
          <label>Plan<select id="plan"><option value="standard">Standard (no ACO)</option><option value="aco">ACO</option></select></label>
          <label>Expires in days<input id="days" type="number" min="1" value="365" /></label>
          <button class="primary" type="submit">Create</button>
        </div>
        <p id="new-key" class="key"></p>
        <button id="give" type="button" hidden>Give access</button>
      </form>
      <div id="list"></div>
    </div>
  </section>
  <script>
    const error = document.getElementById("error")
    const emailInput = document.getElementById("email")
    let token = localStorage.getItem("tcgaio-admin") || ""
    let createdId = ""
    let tab = "pending"
    emailInput.value = localStorage.getItem("tcgaio-admin-email") || ""
    const showError = (message) => { error.className = message ? "error" : ""; error.textContent = message || "" }
    function showLogin(message) {
      token = ""
      localStorage.removeItem("tcgaio-admin")
      document.getElementById("login").hidden = false
      document.getElementById("desk").hidden = true
      document.getElementById("sign-out").hidden = true
      document.getElementById("change-password").hidden = true
      document.getElementById("password-form").hidden = true
      document.getElementById("current-password").value = ""
      document.getElementById("next-password").value = ""
      showError(message || "")
    }
    function showDesk() {
      document.getElementById("login").hidden = true
      document.getElementById("desk").hidden = false
      document.getElementById("sign-out").hidden = false
      document.getElementById("change-password").hidden = false
    }
    const PLAN_LABELS = { standard: "Standard (no ACO)", aco: "ACO" }
    function planSelect(value, onChange) {
      const select = document.createElement("select")
      for (const [id, label] of Object.entries(PLAN_LABELS)) {
        const option = document.createElement("option")
        option.value = id
        option.textContent = label
        select.append(option)
      }
      select.value = PLAN_LABELS[value] ? value : "standard"
      if (onChange) select.onchange = () => onChange(select.value)
      const wrap = document.createElement("label")
      wrap.textContent = "Plan"
      wrap.append(select)
      return { wrap, select }
    }
    function confirmDelete(text) {
      const dialog = document.getElementById("confirm-delete")
      document.getElementById("confirm-delete-text").textContent = text
      return new Promise((resolve) => {
        dialog.onclose = () => resolve(dialog.returnValue === "delete")
        dialog.returnValue = "cancel"
        dialog.showModal()
      })
    }
    function keyButtons(actions, licenseId, plan, label) {
      const picker = planSelect(plan, async (next) => {
        showError("")
        try { await api("/v1/admin/licenses/" + licenseId + "/plan", { method: "POST", body: { plan: next } }); await load() } catch (err) { guard(err) }
      })
      const remove = document.createElement("button")
      remove.type = "button"
      remove.className = "danger"
      remove.textContent = "Delete key"
      remove.onclick = async () => {
        if (!(await confirmDelete("Delete the key for " + label + "?"))) return
        showError("")
        try { await api("/v1/admin/licenses/" + licenseId, { method: "DELETE" }); await load() } catch (err) { guard(err) }
      }
      actions.append(picker.wrap, remove)
    }
    async function api(path, options = {}) {
      const response = await fetch(path, {
        method: options.method || "GET",
        headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
        body: options.body ? JSON.stringify(options.body) : undefined
      })
      const payload = await response.json().catch(() => ({}))
      if (response.status === 401 && !options.login) {
        const err = new Error(payload.error || "Sign in to the admin desk again.")
        err.session = true
        throw err
      }
      if (!response.ok || payload.ok === false) throw new Error(payload.error || "Request failed")
      return payload
    }
    function guard(err) {
      console.error(err)
      if (err && err.session) showLogin(err.message)
      else showError(err && err.message ? err.message : "Request failed")
    }
    function setTab(next) {
      tab = next
      for (const name of ["pending", "active", "suspended", "gifts"]) {
        document.getElementById("tab-" + name).className = "tab" + (name === next ? " on" : "")
      }
      document.getElementById("users").hidden = next === "gifts"
      document.getElementById("gifts").hidden = next !== "gifts"
      load().catch(guard)
    }
    function paintCounts(data) {
      const counts = { pending: data.pendingCount || 0, active: data.activeCount || 0, suspended: data.suspendedCount || 0, gifts: data.giftCount || 0 }
      for (const name of Object.keys(counts)) {
        const badge = document.getElementById("count-" + name)
        if (!badge) continue
        badge.hidden = !counts[name]
        badge.textContent = String(counts[name])
      }
    }
    function userCard(row) {
      const card = document.createElement("article")
      card.className = "card"
      const title = document.createElement("strong")
      title.textContent = row.email
      const pill = document.createElement("span")
      pill.className = "pill" + (row.status === "pending" ? " pending" : "")
      pill.textContent = " " + row.status
      title.append(pill)
      const meta = document.createElement("p")
      const when = row.createdAt ? new Date(row.createdAt).toLocaleString() : "Earlier"
      meta.textContent = "Signed up " + when + " · PC " + (row.fingerprint || "not bound") + (row.lastSeen ? " · last seen " + new Date(row.lastSeen).toLocaleString() : "")
      const actions = document.createElement("div")
      actions.className = "row"
      if (row.role !== "owner") {
        const methodLabel = document.createElement("label")
        methodLabel.textContent = "Payment method"
        const method = document.createElement("input")
        method.value = row.paymentMethod || "Not configured"
        method.placeholder = "Not configured"
        method.onchange = async () => {
          showError("")
          try { await api("/v1/admin/users/" + row.id + "/payment", { method: "POST", body: { paymentMethod: method.value } }) } catch (err) { guard(err) }
        }
        const paid = document.createElement("label")
        paid.className = "check"
        const box = document.createElement("input")
        box.type = "checkbox"
        box.checked = row.paid === true
        box.onchange = async () => {
          showError("")
          try { await api("/v1/admin/users/" + row.id + "/paid", { method: "POST", body: { paid: box.checked } }); await load() } catch (err) { guard(err) }
        }
        paid.append(box, document.createTextNode("Paid"))
        methodLabel.append(method)
        actions.append(methodLabel, paid)
        if (!row.licenseId) {
          const linkPlan = planSelect("aco")
          actions.append(linkPlan.wrap)
          const link = document.createElement("button")
          link.className = "primary"
          link.type = "button"
          link.textContent = "Generate and link license"
          link.onclick = async () => {
            showError("")
            try {
              const payload = await api("/v1/admin/users/" + row.id + "/license", { method: "POST", body: { plan: linkPlan.select.value } })
              window.alert("License linked. Copy the key if you want a record:\n" + payload.key)
              await load()
            } catch (err) { guard(err) }
          }
          actions.append(link)
        }
        const add = (label, action) => {
          const button = document.createElement("button")
          button.type = "button"
          button.textContent = label
          button.onclick = async () => {
            showError("")
            try { await api("/v1/admin/users/" + row.id + "/" + action, { method: "POST", body: {} }); await load() } catch (err) { guard(err) }
          }
          actions.append(button)
        }
        if (row.licenseId) add("Reset PC", "reset")
        if (row.licenseId) keyButtons(actions, row.licenseId, row.plan, row.email)
        add(row.status === "suspended" ? "Unsuspend" : "Suspend", row.status === "suspended" ? "unsuspend" : "suspend")
      } else {
        const note = document.createElement("p")
        note.textContent = "This owner account stays active on every PC."
        actions.append(note)
      }
      card.append(title, meta, actions)
      return card
    }
    async function loadUsers() {
      const query = document.getElementById("search").value.trim()
      const data = await api("/v1/admin/users?status=" + encodeURIComponent(tab) + "&q=" + encodeURIComponent(query))
      paintCounts(data)
      const host = document.getElementById("users")
      host.textContent = ""
      const rows = Array.isArray(data.users) ? data.users : []
      if (!rows.length) {
        const empty = document.createElement("p")
        empty.className = "empty"
        empty.textContent = query ? "No accounts match that search." : tab === "pending" ? "No pending users" : tab === "active" ? "No active users" : "No suspended users"
        host.append(empty)
      }
      for (const row of rows) host.append(userCard(row))
    }
    async function loadGifts() {
      const query = document.getElementById("search").value.trim()
      const data = await api("/v1/admin/overview?q=" + encodeURIComponent(query))
      paintCounts(data)
      const list = document.getElementById("list")
      list.textContent = ""
      const gifts = (Array.isArray(data.licenses) ? data.licenses : []).filter((row) => !row.email)
      if (!gifts.length) {
        const empty = document.createElement("p")
        empty.className = "empty"
        empty.textContent = "No gift keys"
        list.append(empty)
      }
      for (const row of gifts) {
        const card = document.createElement("article")
        card.className = "card"
        const title = document.createElement("strong")
        title.textContent = (row.note || "Gift key") + " · " + row.status
        const meta = document.createElement("p")
        meta.textContent = row.plan + " · PC " + (row.fingerprint || "not bound")
        const actions = document.createElement("div")
        actions.className = "row"
        const add = (label, action) => {
          const button = document.createElement("button")
          button.type = "button"
          button.textContent = label
          button.onclick = async () => {
            showError("")
            try { await api("/v1/admin/licenses/" + row.id + "/" + action, { method: "POST", body: {} }); await load() } catch (err) { guard(err) }
          }
          actions.append(button)
        }
        if (row.status === "draft" || row.status === "suspended") add("Give access", "access")
        add("Reset binding", "reset")
        add("Suspend", "suspend")
        add("Revoke", "revoke")
        keyButtons(actions, row.id, row.plan, row.note || "this gift key")
        card.append(title, meta, actions)
        list.append(card)
      }
    }
    async function load() {
      if (tab === "gifts") await loadGifts()
      else await loadUsers()
    }
    document.getElementById("login-form").onsubmit = async (event) => {
      event.preventDefault()
      showError("")
      try {
        const payload = await api("/v1/admin/login", { method: "POST", login: true, body: { email: emailInput.value, password: password.value } })
        token = payload.token
        localStorage.setItem("tcgaio-admin", token)
        localStorage.setItem("tcgaio-admin-email", emailInput.value.trim())
        showDesk()
        await load()
      } catch (err) { guard(err) }
    }
    for (const name of ["pending", "active", "suspended", "gifts"]) {
      document.getElementById("tab-" + name).onclick = () => setTab(name)
    }
    document.getElementById("create").onclick = () => { document.getElementById("create-form").hidden = false }
    document.getElementById("search").oninput = () => load().catch(guard)
    document.getElementById("sign-out").onclick = () => showLogin("")
    document.getElementById("change-password").onclick = () => { const form = document.getElementById("password-form"); form.hidden = !form.hidden; if (!form.hidden) document.getElementById("current-password").focus() }
    document.getElementById("cancel-password").onclick = () => { document.getElementById("password-form").hidden = true }
    document.getElementById("password-form").onsubmit = async (event) => {
      event.preventDefault()
      showError("")
      try {
        await api("/v1/admin/password", { method: "POST", body: { currentPassword: document.getElementById("current-password").value, password: document.getElementById("next-password").value } })
        showLogin("Password changed. Sign in with the new password.")
      } catch (err) { guard(err) }
    }
    document.getElementById("create-form").onsubmit = async (event) => {
      event.preventDefault()
      showError("")
      try {
        const days = Number(document.getElementById("days").value || 365)
        const payload = await api("/v1/admin/licenses", { method: "POST", body: { note: note.value, plan: plan.value, expiresAt: Date.now() + days * 86400000 } })
        createdId = payload.id
        document.getElementById("new-key").textContent = "Gift key (copy it now): " + payload.key
        document.getElementById("give").hidden = false
        await load()
      } catch (err) { guard(err) }
    }
    document.getElementById("give").onclick = async () => {
      showError("")
      try { await api("/v1/admin/licenses/" + createdId + "/access", { method: "POST", body: {} }); document.getElementById("give").hidden = true; await load() } catch (err) { guard(err) }
    }
    window.addEventListener("error", (event) => {
      console.error(event.error || event.message)
      showError(event.message || "Something went wrong.")
    })
    if (token) {
      showDesk()
      load().catch(guard)
    }
    setInterval(() => { if (token) load().catch(guard) }, 15000)
  </script>
  <dialog id="confirm-delete">
    <form method="dialog">
      <h2>Delete this key?</h2>
      <p id="confirm-delete-text"></p>
      <p class="hint">The customer loses access right away. Their account stays, back in Pending, so you can link a new key later. This cannot be undone.</p>
      <div class="row">
        <button value="cancel" type="submit">Cancel</button>
        <button value="delete" type="submit" class="danger">Delete key</button>
      </div>
    </form>
  </dialog>
</body>
</html>

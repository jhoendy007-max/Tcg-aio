<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TCGAIO admin</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #101217; color: #f4f1ea; }
    body { margin: 0 auto; padding: 20px; max-width: 920px; }
    h1 { font-size: 26px; margin: 0; }
    p, small { color: #9aa3b2; }
    button, input { font: inherit; color: inherit; border-radius: 8px; border: 1px solid #343b49; background: #181c24; padding: 8px 12px; }
    button.primary { background: #e0b15a; color: #1c1508; border-color: transparent; font-weight: 700; }
    button.tab { background: transparent; }
    button.tab.on { background: #2a3140; color: #f4f1ea; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .card { border: 1px solid #2a3140; border-radius: 12px; padding: 12px; margin: 10px 0; background: #181c24; }
    .error { background: #3a1d1d; color: #ffd0d0; padding: 10px 12px; border-radius: 8px; }
    .key { word-break: break-all; font-family: ui-monospace, monospace; }
    label { display: flex; flex-direction: column; gap: 4px; min-width: 160px; font-size: 13px; color: #c8cdd4; }
    .pill { border-radius: 999px; padding: 2px 8px; background: #2a3140; font-size: 12px; }
    .pill.pending { background: #3d3420; color: #e0b15a; }
    .badge { background: #e0b15a; color: #1c1508; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 700; }
    .check { flex-direction: row; align-items: center; gap: 8px; min-width: 0; }
  </style>
</head>
<body>
  <h1>TCGAIO admin</h1>
  <p>Pending accounts come first. A gift key can still be created on its own and redeemed in the customer's account.</p>
  <div id="error"></div>
  <section id="login">
    <form id="login-form" class="card row">
      <label>Email<input id="email" type="email" autocomplete="username" required /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>
  <section id="desk" hidden>
    <div class="row">
      <button class="tab on" id="tab-pending" type="button">Pending <span id="badge" class="badge" hidden>0</span></button>
      <button class="tab" id="tab-active" type="button">Active</button>
      <button class="tab" id="tab-suspended" type="button">Suspended</button>
      <button class="tab" id="tab-gifts" type="button">Gift keys</button>
      <input id="search" placeholder="Search email" />
    </div>
    <div id="users"></div>
    <div id="gifts" hidden>
      <div class="row">
        <button class="primary" id="create" type="button">Create gift key</button>
      </div>
      <form id="create-form" class="card" hidden>
        <div class="row">
          <label>Note<input id="note" placeholder="Gift" /></label>
          <label>Plan<input id="plan" value="standard" /></label>
          <label>Expires in days<input id="days" type="number" min="1" value="365" /></label>
          <button class="primary" type="submit">Create</button>
        </div>
        <p id="new-key" class="key"></p>
        <button id="give" type="button" hidden>Give access</button>
      </form>
      <div id="list"></div>
    </div>
  </section>
  <script>
    const error = document.getElementById("error")
    let token = localStorage.getItem("tcgaio-admin") || ""
    let createdId = ""
    let tab = "pending"
    const showError = (message) => { error.className = message ? "error" : ""; error.textContent = message || "" }
    async function api(path, options = {}) {
      const response = await fetch(path, {
        method: options.method || "GET",
        headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
        body: options.body ? JSON.stringify(options.body) : undefined
      })
      const payload = await response.json()
      if (!response.ok || payload.ok === false) throw new Error(payload.error || "Request failed")
      return payload
    }
    function setTab(next) {
      tab = next
      for (const name of ["pending", "active", "suspended", "gifts"]) {
        document.getElementById("tab-" + name).className = "tab" + (name === next ? " on" : "")
      }
      document.getElementById("users").hidden = next === "gifts"
      document.getElementById("gifts").hidden = next !== "gifts"
      load().catch((err) => showError(err.message))
    }
    function userCard(row) {
      const card = document.createElement("article")
      card.className = "card"
      const title = document.createElement("strong")
      title.textContent = row.email
      const pill = document.createElement("span")
      pill.className = "pill" + (row.status === "pending" ? " pending" : "")
      pill.textContent = " " + row.status
      title.append(pill)
      const meta = document.createElement("p")
      const when = row.createdAt ? new Date(row.createdAt).toLocaleString() : "Earlier"
      meta.textContent = "Signed up " + when + " · PC " + (row.fingerprint || "not bound") + (row.lastSeen ? " · last seen " + new Date(row.lastSeen).toLocaleString() : "")
      const actions = document.createElement("div")
      actions.className = "row"
      if (row.role !== "owner") {
        const methodLabel = document.createElement("label")
        methodLabel.textContent = "Payment method"
        const method = document.createElement("input")
        method.value = row.paymentMethod || "Not configured"
        method.placeholder = "Not configured"
        method.onchange = async () => {
          showError("")
          try { await api("/v1/admin/users/" + row.id + "/payment", { method: "POST", body: { paymentMethod: method.value } }) } catch (err) { showError(err.message) }
        }
        const paid = document.createElement("label")
        paid.className = "check"
        const box = document.createElement("input")
        box.type = "checkbox"
        box.checked = row.paid === true
        box.onchange = async () => {
          showError("")
          try { await api("/v1/admin/users/" + row.id + "/paid", { method: "POST", body: { paid: box.checked } }); await load() } catch (err) { showError(err.message) }
        }
        paid.append(box, document.createTextNode("Paid"))
        methodLabel.append(method)
        actions.append(methodLabel, paid)
        if (!row.licenseId) {
          const link = document.createElement("button")
          link.className = "primary"
          link.type = "button"
          link.textContent = "Generate and link license"
          link.onclick = async () => {
            showError("")
            try {
              const payload = await api("/v1/admin/users/" + row.id + "/license", { method: "POST", body: {} })
              window.alert("License linked. Copy the key if you want a record:\n" + payload.key)
              await load()
            } catch (err) { showError(err.message) }
          }
          actions.append(link)
        }
        const add = (label, action) => {
          const button = document.createElement("button")
          button.type = "button"
          button.textContent = label
          button.onclick = async () => {
            showError("")
            try { await api("/v1/admin/users/" + row.id + "/" + action, { method: "POST", body: {} }); await load() } catch (err) { showError(err.message) }
          }
          actions.append(button)
        }
        if (row.licenseId) add("Reset PC", "reset")
        add(row.status === "suspended" ? "Unsuspend" : "Suspend", row.status === "suspended" ? "unsuspend" : "suspend")
      }
      card.append(title, meta, actions)
      return card
    }
    async function loadUsers() {
      const query = document.getElementById("search").value.trim()
      const data = await api("/v1/admin/users?status=" + encodeURIComponent(tab) + "&q=" + encodeURIComponent(query))
      const badge = document.getElementById("badge")
      badge.hidden = !data.pendingCount
      badge.textContent = String(data.pendingCount || 0)
      const host = document.getElementById("users")
      host.textContent = ""
      if (!data.users.length) {
        const empty = document.createElement("p")
        empty.textContent = "No accounts in this list."
        host.append(empty)
      }
      for (const row of data.users) host.append(userCard(row))
    }
    async function loadGifts() {
      const query = document.getElementById("search").value.trim()
      const data = await api("/v1/admin/overview?q=" + encodeURIComponent(query))
      const list = document.getElementById("list")
      list.textContent = ""
      for (const row of data.licenses) {
        if (row.email) continue
        const card = document.createElement("article")
        card.className = "card"
        const title = document.createElement("strong")
        title.textContent = (row.note || "Gift key") + " · " + row.status
        const meta = document.createElement("p")
        meta.textContent = row.plan + " · PC " + (row.fingerprint || "not bound")
        const actions = document.createElement("div")
        actions.className = "row"
        const add = (label, action) => {
          const button = document.createElement("button")
          button.type = "button"
          button.textContent = label
          button.onclick = async () => {
            showError("")
            try { await api("/v1/admin/licenses/" + row.id + "/" + action, { method: "POST", body: {} }); await load() } catch (err) { showError(err.message) }
          }
          actions.append(button)
        }
        if (row.status === "draft" || row.status === "suspended") add("Give access", "access")
        add("Reset binding", "reset")
        add("Suspend", "suspend")
        add("Revoke", "revoke")
        card.append(title, meta, actions)
        list.append(card)
      }
    }
    async function load() {
      if (tab === "gifts") await loadGifts()
      else await loadUsers()
    }
    document.getElementById("login-form").onsubmit = async (event) => {
      event.preventDefault()
      showError("")
      try {
        const payload = await api("/v1/admin/login", { method: "POST", body: { email: email.value, password: password.value } })
        token = payload.token
        localStorage.setItem("tcgaio-admin", token)
        document.getElementById("login").hidden = true
        document.getElementById("desk").hidden = false
        await load()
      } catch (err) { showError(err.message) }
    }
    for (const name of ["pending", "active", "suspended", "gifts"]) {
      document.getElementById("tab-" + name).onclick = () => setTab(name)
    }
    document.getElementById("create").onclick = () => { document.getElementById("create-form").hidden = false }
    document.getElementById("search").oninput = () => load().catch((err) => showError(err.message))
    document.getElementById("create-form").onsubmit = async (event) => {
      event.preventDefault()
      showError("")
      try {
        const days = Number(document.getElementById("days").value || 365)
        const payload = await api("/v1/admin/licenses", { method: "POST", body: { note: note.value, plan: plan.value, expiresAt: Date.now() + days * 86400000 } })
        createdId = payload.id
        document.getElementById("new-key").textContent = "Gift key (copy it now): " + payload.key
        document.getElementById("give").hidden = false
        await load()
      } catch (err) { showError(err.message) }
    }
    document.getElementById("give").onclick = async () => {
      showError("")
      try { await api("/v1/admin/licenses/" + createdId + "/access", { method: "POST", body: {} }); document.getElementById("give").hidden = true; await load() } catch (err) { showError(err.message) }
    }
    if (token) {
      document.getElementById("login").hidden = true
      document.getElementById("desk").hidden = false
      load().catch(() => { token = ""; localStorage.removeItem("tcgaio-admin"); document.getElementById("login").hidden = false; document.getElementById("desk").hidden = true })
    }
    setInterval(() => { if (token && tab !== "gifts") loadUsers().catch(() => undefined) }, 15000)
  </script>
</body>
</html>

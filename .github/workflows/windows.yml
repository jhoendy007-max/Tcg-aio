name: Windows build

on:
  push:
    branches: [main, "cursor/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Phone typecheck
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
      - name: Pack Session Sync
        run: node scripts/pack-extension.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Session-Sync
          path: |
            release/TCGAIO-Session-Sync-*.zip
            release/TCGAIO-Session-Sync-*.crx
          if-no-files-found: error
      - name: Publish the extension
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: release/TCGAIO-Session-Sync-*.zip
          overwrite_files: true
      - name: Publish the desktop tour
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: release-assets/desktop-home-tasks-phone-tour.mp4
          overwrite_files: true

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          overwrite_files: true
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: mobile
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TCGAIO_GENERATE_KEYSTORE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash mobile/scripts/assemble-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Android-APK
          path: release/TCGAIO-Phone-*.apk
          if-no-files-found: error
      - name: Save the release keystore for the next tagged build
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: tcgaio-release-keystore
          path: |
            mobile/release.keystore
            mobile/keystore.properties
          retention-days: 90
          if-no-files-found: error
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: release/TCGAIO-Phone-*.apk
          overwrite_files: true
          generate_release_notes: true
      - name: Replace the broken debug APK on v0.2.0-beta
        if: github.ref == 'refs/tags/v0.2.1-beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp release/TCGAIO-Phone-0.2.1.apk release/TCGAIO-Phone-0.2.0.apk
          gh release upload v0.2.0-beta release/TCGAIO-Phone-0.2.0.apk --clobber

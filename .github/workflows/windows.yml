name: Windows build

on:
  push:
    branches: [main, "cursor/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chrome for the shell scroll test
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Phone typecheck
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
      - name: Admin app typecheck
        working-directory: admin-mobile
        run: |
          npm ci
          npm run typecheck
      - name: Pack Session Sync
        run: node scripts/pack-extension.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Session-Sync
          path: |
            release/TCGAIO-Session-Sync-*.zip
            release/TCGAIO-Session-Sync-*.crx
          if-no-files-found: error
      - name: Refuse a release without the license server
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TCGAIO_LICENSE_URL: ${{ secrets.TCGAIO_LICENSE_URL }}
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
          TCGAIO_REQUIRE_LICENSE: "1"
        run: |
          node scripts/require-license-build.mjs preflight
          node scripts/confirm-baked-license-key.mjs --secret-only

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Windows installer
        env:
          TCGAIO_LICENSE_URL: ${{ secrets.TCGAIO_LICENSE_URL }}
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
          TCGAIO_REQUIRE_LICENSE: "1"
        run: npm run dist:win
      - name: Confirm the license key baked into app.asar
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
        run: node scripts/confirm-baked-license-key.mjs release/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Windows-Setup
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            release/win-unpacked/resources/app.asar
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: mobile
      - name: Check Android signing secrets
        env:
          HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          missing=""
          [[ "$HAS_KS" == "true" ]] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [[ "$HAS_PASS" == "true" ]] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [[ "$HAS_ALIAS" == "true" ]] || missing="$missing ANDROID_KEY_ALIAS"
          [[ "$HAS_KEYPASS" == "true" ]] || missing="$missing ANDROID_KEY_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "::warning title=Android signing secrets missing::Add these repository secrets:$missing. Until then the build reuses the last saved keystore artifact (it is no longer re-uploaded)."
          fi
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TCGAIO_LICENSE_URL: ${{ secrets.TCGAIO_LICENSE_URL }}
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
          EXPO_PUBLIC_TCGAIO_LICENSE_URL: ${{ secrets.TCGAIO_LICENSE_URL }}
          EXPO_PUBLIC_TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
          TCGAIO_REQUIRE_LICENSE: ${{ github.ref_type == 'tag' && '1' || '0' }}
          TCGAIO_GENERATE_KEYSTORE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash mobile/scripts/assemble-release.sh
      - name: Confirm the license key baked into the phone APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
        run: node scripts/confirm-baked-license-key.mjs release/TCGAIO-Phone-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Android-APK
          path: release/TCGAIO-Phone-*.apk
          if-no-files-found: error
      - name: Replace the broken debug APK on v0.2.0-beta
        if: github.ref == 'refs/tags/v0.2.1-beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp release/TCGAIO-Phone-0.2.1.apk release/TCGAIO-Phone-0.2.0.apk
          gh release upload v0.2.0-beta release/TCGAIO-Phone-0.2.0.apk --clobber

  # The admin APK is a CI artifact only. This repo is public, so it is never attached to a GitHub release.
  admin-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: admin-mobile
      - name: Check Android signing secrets
        env:
          HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          missing=""
          [[ "$HAS_KS" == "true" ]] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [[ "$HAS_PASS" == "true" ]] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [[ "$HAS_ALIAS" == "true" ]] || missing="$missing ANDROID_KEY_ALIAS"
          [[ "$HAS_KEYPASS" == "true" ]] || missing="$missing ANDROID_KEY_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "::warning title=Android signing secrets missing::Add these repository secrets:$missing. Until then the build reuses the last saved keystore artifact (it is no longer re-uploaded)."
          fi
      - name: Build the admin release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TCGAIO_LICENSE_URL: ${{ secrets.TCGAIO_LICENSE_URL }}
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
          EXPO_PUBLIC_TCGAIO_LICENSE_URL: ${{ secrets.TCGAIO_LICENSE_URL }}
          EXPO_PUBLIC_TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
          TCGAIO_REQUIRE_LICENSE: ${{ github.ref_type == 'tag' && '1' || '0' }}
          TCGAIO_GENERATE_KEYSTORE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash admin-mobile/scripts/assemble-release.sh
      - name: Confirm the license key baked into the admin APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
        run: node scripts/confirm-baked-license-key.mjs release/TCGAIO-Admin-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Admin-APK
          path: release/TCGAIO-Admin-*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, windows, android, admin-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Confirm the baked license public key before publishing
        env:
          TCGAIO_LICENSE_PUBLIC_KEY: ${{ secrets.TCGAIO_LICENSE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ASAR="$(find artifacts/TCGAIO-Windows-Setup -name app.asar -type f | head -1)"
          PHONE="$(find artifacts/TCGAIO-Android-APK -name 'TCGAIO-Phone-*.apk' -type f | head -1)"
          ADMIN="$(find artifacts/TCGAIO-Admin-APK -name 'TCGAIO-Admin-*.apk' -type f | head -1)"
          test -n "$ASAR"
          test -n "$PHONE"
          test -n "$ADMIN"
          node scripts/confirm-baked-license-key.mjs "$ASAR" "$PHONE" "$ADMIN"
      - name: Collect the public release files
        run: |
          set -euo pipefail
          mkdir -p publish-files
          find artifacts/TCGAIO-Windows-Setup -type f \( -name '*.exe' -o -name 'latest.yml' -o -name '*.blockmap' \) -exec cp {} publish-files/ \;
          find artifacts/TCGAIO-Android-APK -type f -name 'TCGAIO-Phone-*.apk' -exec cp {} publish-files/ \;
          find artifacts/TCGAIO-Session-Sync -type f -name 'TCGAIO-Session-Sync-*.zip' -exec cp {} publish-files/ \;
          cp release-assets/desktop-home-tasks-phone-tour.mp4 publish-files/
          test -n "$(find publish-files -name '*.exe' -print -quit)"
          test -n "$(find publish-files -name 'latest.yml' -print -quit)"
          test -n "$(find publish-files -name '*.blockmap' -print -quit)"
          test -n "$(find publish-files -name 'TCGAIO-Phone-*.apk' -print -quit)"
          test -n "$(find publish-files -name 'TCGAIO-Session-Sync-*.zip' -print -quit)"
          if find publish-files -name 'TCGAIO-Admin-*.apk' -print -quit | grep -q .; then
            echo "The admin APK must stay off the public release." >&2
            exit 1
          fi
          find publish-files -type f -printf '%f\n'
      - name: Publish the prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          overwrite_files: true
          files: publish-files/*
      - name: Upload the admin APK to the license server
        env:
          TCGAIO_LICENSE_URL: ${{ secrets.TCGAIO_LICENSE_URL }}
          TCGAIO_ADMIN_UPLOAD_TOKEN: ${{ secrets.TCGAIO_ADMIN_UPLOAD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          cp artifacts/TCGAIO-Admin-APK/TCGAIO-Admin-*.apk release/
          bash admin-mobile/scripts/upload-admin-apk.sh

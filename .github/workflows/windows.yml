name: Windows build

on:
  push:
    branches: [main, "cursor/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Phone typecheck
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: release/*.exe
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android
      - name: Name the APK
        run: |
          mkdir -p release
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release/TCGAIO-Phone-0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TCGAIO-Android-APK
          path: release/TCGAIO-Phone-0.2.0.apk
          if-no-files-found: error
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: release/TCGAIO-Phone-0.2.0.apk
          generate_release_notes: true
